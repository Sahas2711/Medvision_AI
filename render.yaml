services:
  - type: web
    name: aarogya-drishti
    env: python
    runtime: python-3.12   # Better compatibility with TensorFlow
    buildCommand: "export GIT_LFS_SKIP_SMUDGE=1 && pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt"
    startCommand: "cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --max-requests 100 --max-requests-jitter 10 app_deploy:app"
    envVars:
      - key: PORT
        value: 10000
