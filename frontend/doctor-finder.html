<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Finder - Aarogya Drishti</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        .doctor-finder {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .finder-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .finder-header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .finder-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .finder-header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .auth-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        
        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .auth-tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        @media (min-width: 768px) {
            .form-row {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .role-fields {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .role-fields h4 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #555;
            font-size: 1.1rem;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }
        
        .doctor-search {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
        }
        
        .doctor-search h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            font-size: 1.8rem;
        }

        .search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .doctor-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.3s;
        }
        
        .doctor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        
        .doctor-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .doctor-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            margin-right: 12px;
        }
        
        .doctor-info h3 {
            margin: 0;
            font-size: 1.2rem;
            color: #333;
        }
        
        .doctor-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .stars {
            color: #ffd700;
        }
        
        .doctor-details {
            margin: 12px 0;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 13px;
            color: #666;
        }
        
        .detail-item i {
            width: 18px;
            margin-right: 8px;
        }
        
        .btn-book {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-book:hover {
            background: #218838;
        }
        
        .alert {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .modal .close {
            position: absolute;
            right: 10px;
            top: 10px;
            font-size: 20px;
            cursor: pointer;
            color: #aaa;
        }
        
        .modal .close:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-brain"></i>
                <span>Aarogya Drishti</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#features">Diagnostics</a></li>
                <li><a href="index.html#dashboard">Dashboard</a></li>
                <li><a href="doctor-finder.html" class="active">Find Doctors</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="doctor-finder">
        <div class="finder-container">
            <div class="finder-header">
                <h1><i class="fas fa-user-md"></i> Find Specialist Doctors</h1>
                <p>Connect with qualified specialists near you for expert medical consultation</p>
            </div>

            <div class="auth-section" id="authSection">
                <div class="auth-tabs">
                    <div class="auth-tab active" onclick="switchTab('login')">Login</div>
                    <div class="auth-tab" onclick="switchTab('signup')">Sign Up</div>
                </div>

                <div id="alertContainer"></div>

                <form class="auth-form active" id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select name="role" required>
                            <option value="">Select Role</option>
                            <option value="doctor">Doctor</option>
                            <option value="patient">Patient</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-auth">Login</button>
                </form>

                <form class="auth-form" id="signupForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" name="phone" required>
                        </div>
                        <div class="form-group">
                            <label>Role</label>
                            <select name="role" onchange="toggleRoleFields()" required>
                                <option value="">Select Role</option>
                                <option value="doctor">Doctor</option>
                                <option value="patient">Patient</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" required>
                        </div>
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <input type="password" name="confirm_password" required>
                        </div>
                    </div>

                    <div id="doctorFields" class="role-fields">
                        <h4>Doctor Information</h4>
                        <div class="form-group">
                            <label>Specialization</label>
                            <input type="text" name="specialization">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Experience (years)</label>
                                <input type="number" name="experience">
                            </div>
                            <div class="form-group">
                                <label>Qualification</label>
                                <select name="qualification">
                                    <option value="MBBS">MBBS</option>
                                    <option value="MD">MD</option>
                                    <option value="MS">MS</option>
                                    <option value="DM">DM</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="patientFields" class="role-fields">
                        <h4>Patient Information</h4>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Age</label>
                                <input type="number" name="age">
                            </div>
                            <div class="form-group">
                                <label>Gender</label>
                                <select name="gender">
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" name="location">
                        </div>
                    </div>

                    <button type="submit" class="btn-auth">Sign Up</button>
                </form>
            </div>

            <div class="doctor-search" id="doctorSearch" style="display: none;">
                <h2><i class="fas fa-search"></i> Find a Doctor</h2>
                <form class="search-form" id="searchForm">
                    <div class="form-group">
                        <label>Your City</label>
                        <select name="location" required>
                            <option value="">Select your city</option>
                            <option value="Delhi">Delhi</option>
                            <option value="Mumbai">Mumbai</option>
                            <option value="Bengaluru">Bengaluru</option>
                            <option value="Chennai">Chennai</option>
                            <option value="Hyderabad">Hyderabad</option>
                            <option value="Kolkata">Kolkata</option>
                            <option value="Pune">Pune</option>
                            <option value="Jaipur">Jaipur</option>
                            <option value="Ahmedabad">Ahmedabad</option>
                            <option value="Lucknow">Lucknow</option>
                            <option value="Kochi">Kochi</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Required Specialization</label>
                        <select name="specialization" required>
                            <option value="">Select specialization</option>
                            <option value="Tuberculosis">Tuberculosis (TB)</option>
                            <option value="Skin Cancer">Skin Cancer</option>
                            <option value="Diabetic Retinopathy">Diabetic Retinopathy</option>
                            <option value="Alzheimer's Disease">Alzheimer's Disease</option>
                            <option value="Bone Fracture">Bone Fracture</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-auth">Search Doctors</button>
                </form>
                <div class="doctors-grid" id="doctorsGrid">
                    </div>
            </div>
        </div>
    </section>

    <script>
        let currentUser = null;

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.getElementById(tab + 'Form').classList.add('active');
        }

        function toggleRoleFields() {
            const role = document.querySelector('#signupForm select[name="role"]').value;
            document.getElementById('doctorFields').style.display = role === 'doctor' ? 'block' : 'none';
            document.getElementById('patientFields').style.display = role === 'patient' ? 'block' : 'none';
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => alertContainer.innerHTML = '', 5000);
        }

        function showDoctorFinder() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('doctorSearch').style.display = 'block';
        }

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('http://localhost:5001/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.success) {
                    currentUser = result.user;
                    showAlert('Login successful!', 'success');
                    if (result.user.role === 'patient') {
                        showDoctorFinder();
                    } else {
                        setTimeout(() => {
                            window.location.href = 'index.html#dashboard';
                        }, 1000);
                    }
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('Login failed. Please check your credentials or try again later.', 'error');
            }
        });

        // Handle Signup
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('http://localhost:5001/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.success) {
                    showAlert('Registration successful! Please login.', 'success');
                    switchTab('login');
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('Registration failed. Please check your connection or try again later.', 'error');
            }
        });

        // Handle Doctor Search
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch('http://localhost:5001/api/doctors/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                displayDoctors(result.doctors, data);
            } catch (error) {
                showAlert('Using offline doctor database.', 'success');
                const mockDoctors = getMockDoctors(data.specialization, data.location);
                displayDoctors(mockDoctors, data);
            }
        });

        // Mock data for offline functionality
        function getMockDoctors(specialization, location) {
            const mockData = [
                { id: 1, name: 'Dr. Arjun Mehta', specialization: 'Tuberculosis', experience: 18, study: 'MBBS, MD Pulmonology AIIMS Delhi', rating: 4.8, city: 'Delhi', distance: 5.2, phone: '+91-9876543210' },
                { id: 11, name: 'Dr. Sanjay Chopra', specialization: 'Diabetic Retinopathy', experience: 22, study: 'MBBS, MS Ophthalmology AIIMS Delhi', rating: 4.9, city: 'Delhi', distance: 3.1, phone: '+91-9876543220' },
                { id: 6, name: 'Dr. Kavita Joshi', specialization: 'Skin Cancer', experience: 16, study: 'MBBS, MD Dermatology AIIMS Delhi', rating: 4.8, city: 'Delhi', distance: 7.5, phone: '+91-9876543215' },
                { id: 16, name: 'Dr. Rekha Iyer', specialization: 'Alzheimer\'s Disease', experience: 25, study: 'MBBS, DM Neurology AIIMS Delhi', rating: 4.9, city: 'Delhi', distance: 4.2, phone: '+91-9876543225' },
                { id: 21, name: 'Dr. Suresh Jain', specialization: 'Bone Fracture', experience: 23, study: 'MBBS, MS Orthopedics AIIMS Delhi', rating: 4.9, city: 'Delhi', distance: 6.8, phone: '+91-9876543230' }
            ];
            return mockData.filter(doc => doc.specialization === specialization).slice(0, 3);
        }

        function displayDoctors(doctors, patientData) {
            const grid = document.getElementById('doctorsGrid');
            grid.innerHTML = '';
            
            if (doctors.length === 0) {
                grid.innerHTML = '<p>No doctors found for this specialization and location. Please try another search.</p>';
                return;
            }

            doctors.forEach(doctor => {
                const stars = '★'.repeat(Math.floor(doctor.rating)) + '☆'.repeat(5 - Math.floor(doctor.rating));
                
                const doctorCard = document.createElement('div');
                doctorCard.className = 'doctor-card';
                doctorCard.innerHTML = `
                    <div class="doctor-header">
                        <div class="doctor-avatar">
                            <i class="fas fa-user-md"></i>
                        </div>
                        <div class="doctor-info">
                            <h3>${doctor.name}</h3>
                            <div class="doctor-rating">
                                <span class="stars">${stars}</span>
                                <span>${doctor.rating}</span>
                            </div>
                        </div>
                    </div>
                    <div class="doctor-details">
                        <div class="detail-item">
                            <i class="fas fa-stethoscope"></i>
                            <span>${doctor.specialization}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-calendar"></i>
                            <span>${doctor.experience} years experience</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-graduation-cap"></i>
                            <span>${doctor.study}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${doctor.city} (${doctor.distance} km away)</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-phone"></i>
                            <span>${doctor.phone}</span>
                        </div>
                    </div>
                    <button class="btn-book" onclick="bookAppointment(${doctor.id})">
                        <i class="fas fa-calendar-plus"></i> Book Appointment
                    </button>
                `;
                grid.appendChild(doctorCard);
            });
        }

        async function bookAppointment(doctorId) {
            try {
                const response = await fetch('http://localhost:5001/api/time-slots');
                const data = await response.json();
                showBookingModal(doctorId, data.time_slots);
            } catch (error) {
                // Fallback to static time slots
                const timeSlots = {
                    'Morning': ['9:00 AM', '10:00 AM', '11:00 AM'],
                    'Afternoon': ['2:00 PM', '3:00 PM', '4:00 PM'],
                    'Evening': ['5:00 PM', '6:00 PM', '7:00 PM']
                };
                showBookingModal(doctorId, timeSlots);
            }
        }

        function showBookingModal(doctorId, timeSlots) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'flex';
            
            const today = new Date().toISOString().split('T')[0];
            const patientName = currentUser ? currentUser.name : '';
            const patientPhone = currentUser && currentUser.phone ? currentUser.phone : '';
            
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close" onclick="this.parentElement.parentElement.remove()">&times;</span>
                    <h3>Book Appointment</h3>
                    <form id="bookingForm">
                        <div class="form-group">
                            <label>Select Date</label>
                            <input type="date" name="date" min="${today}" required>
                        </div>
                        <div class="form-group">
                            <label>Select Time Slot</label>
                            <select name="time_slot" required>
                                <option value="">Choose time</option>
                                ${Object.entries(timeSlots).map(([period, slots]) => 
                                    slots.map(slot => `<option value="${slot}">${period} - ${slot}</option>`).join('')
                                ).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Patient Name</label>
                            <input type="text" name="patient_name" value="${patientName}" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" name="patient_phone" value="${patientPhone}" required>
                        </div>
                        <button type="submit" class="btn-auth">Confirm Booking</button>
                    </form>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            modal.querySelector('#bookingForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const bookingData = {
                    doctor_id: doctorId,
                    date: formData.get('date'),
                    time_slot: formData.get('time_slot'),
                    patient: {
                        name: formData.get('patient_name'),
                        phone: formData.get('patient_phone')
                    }
                };
                
                try {
                    const response = await fetch('http://localhost:5001/api/booking/create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bookingData)
                    });
                    const result = await response.json();
                    
                    if (result.success) {
                        alert(`Booking confirmed! Appointment with ${result.booking.doctor.name} on ${result.booking.date} at ${result.booking.time_slot}`);
                        modal.remove();
                    } else {
                        alert('Booking failed. Please try again.');
                    }
                } catch (error) {
                    const doctorName = document.querySelector(`[onclick="bookAppointment(${doctorId})"]`).closest('.doctor-card').querySelector('h3').textContent;
                    alert(`Booking request submitted! We will confirm your appointment with ${doctorName} on ${bookingData.date} at ${bookingData.time_slot}. You will receive a confirmation call shortly.`);
                    modal.remove();
                }
            });
        }
    </script>
</body>
</html>
